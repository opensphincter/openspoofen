name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e .[dev]

      - name: Lint
        run: ruff check src tests scripts examples

      - name: Run tests
        run: pytest

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The local sandbox proxy blocks the npm audit endpoint; CI is the
      # unrestricted network where the JS dependency audit actually runs.
      - name: Audit JS dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build

      # Built output is committed by convention; fail if it drifted from sources.
      - name: Verify committed static assets are current
        run: git diff --exit-code -- src/openspoofen/static
