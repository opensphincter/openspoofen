<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>OpenSpoofen</title>
    <meta name="theme-color" content="#0b1624">
    <link rel="manifest" href="{{ url_for('manifest') }}">
    <link rel="icon" href="{{ url_for('static', filename='icons/favicon.ico') }}" sizes="any">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard-app.css', v=frontend_asset_version) }}">
</head>
<body>
    <noscript>
        <div style="padding: 1rem; font-family: sans-serif; color: #fff; background: #0b1624; min-height: 100vh;">
            OpenSpoofen now requires JavaScript to render the mobile remote interface.
        </div>
    </noscript>
    <div id="remote-app"></div>
    <script id="dashboard-bootstrap" type="application/json">{{ dashboard_bootstrap|tojson }}</script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.getRegistrations()
                    .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister())))
                    .catch(() => undefined);
                if ("caches" in window) {
                    caches.keys()
                        .then((keys) => Promise.all(keys.filter((key) => key.startsWith("openspoofen-shell-")).map((key) => caches.delete(key))))
                        .catch(() => undefined);
                }
            });
        }
    </script>
    <script type="module" src="{{ url_for('static', filename='dashboard-app.js', v=frontend_asset_version) }}"></script>
</body>
</html>
