[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openspoofen"
version = "0.3.0"
description = "Route a smart TV through a VPN on a Raspberry Pi and switch its location from your phone"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "garzione" },
]
keywords = ["raspberry-pi", "vpn", "wireguard", "smart-tv", "appliance", "flask"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
]
dependencies = [
    "Flask>=3.1,<4.0",
    "flask-compress>=1.17,<2.0",
    "gunicorn>=26.0,<27.0",
    "orjson>=3.10,<4.0",
    "samsungtvws>=3.0,<4.0",
]

[project.urls]
Homepage = "https://github.com/opensphincter/openspoofen"
Source = "https://github.com/opensphincter/openspoofen"
Issues = "https://github.com/opensphincter/openspoofen/issues"
Changelog = "https://github.com/opensphincter/openspoofen/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-testinfra>=10.2,<11.0",
    "ruff>=0.16,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Invoked through an interpreter under `infisical run`, not executed directly.
"scripts/pi-ssh.py" = ["EXE001"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openspoofen = ["templates/*.html", "static/*", "static/icons/*"]